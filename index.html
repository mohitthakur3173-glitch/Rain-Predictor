<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rain Predictor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
      text-align: center;
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
      font-size: 14px;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input[type="number"]:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
    }

    .result.success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 2px solid #4caf50;
    }

    .result.error {
      background: #ffebee;
      color: #c62828;
      border: 2px solid #f44336;
    }

    .info-text {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-left: 4px solid #667eea;
      border-radius: 4px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🌧️ Rain Predictor</h1>
    <form method="post">
      <div class="form-group">
        <label for="temperature">Temperature (°C)</label>
        <input type="number" id="temperature" name="temperature" step="0.1" required placeholder="e.g., 25.5">
      </div>

      <div class="form-group">
        <label for="cloud_cover">Cloud Cover (%)</label>
        <input type="number" id="cloud_cover" name="cloud_cover" step="0.1" min="0" max="100" required
          placeholder="e.g., 50">
      </div>

      <button type="submit">Predict Rain</button>
    </form>

    {% if prediction %}
    <div class="result success">
      📊 Prediction: <strong>{{ prediction }}</strong>
    </div>
    {% endif %}

    {% if error %}
    <div class="result error">
      ⚠️ Error: {{ error }}
    </div>
    {% endif %}

    <div class="info-text">
      <strong>ℹ️ How to use:</strong><br>
      Enter the temperature (in Celsius) and cloud cover percentage (0-100) to predict if it will rain.
    </div>
  </div>
</body>

</html>
